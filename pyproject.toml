[project]
name = "agent-colab"
version = "0.0.0"
description = "Agent-Colab — self-hosted collaboration operations platform for humans and AI Agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary,pool]>=3.2",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "cryptography>=43",
  "httpx>=0.27",
  "mcp>=1.2",
  "prometheus-client>=0.20",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "hypothesis>=6.110",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7.9",
  "pip-audit>=2.7",
  "types-PyYAML",
  "types-jsonschema",
  "croniter>=3",
]

[project.scripts]
agent-colab = "server.main:cli"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "sidecar"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["server", "sidecar", "tests", "tools"]

# Verifier-produced evidence (verification/) is stored unmodified and is not project code
extend-exclude = ["verification"]
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]
ignore = ["S101", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["server", "sidecar", "tools", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "S607"]
"tools/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["server", "sidecar", "tools"]
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["croniter.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -ra --strict-markers"
markers = [
  "db: requires a disposable PostgreSQL (AGENT_COLAB_TEST_DATABASE_URL)",
  "spike: external spike evidence generation (network/provider required)",
]

[tool.coverage.run]
source = ["server", "sidecar"]
branch = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "node_modules"]
# B608 duplicates ruff S608, which is enforced per line with an explicit justification wherever a
# query interpolates a constant identifier (column lists, table names from ChainSpec/Projector).
# Every user-supplied value is bound as a parameter; see ADR-0008.
skips = ["B101", "B608"]
