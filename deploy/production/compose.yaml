# Production-like stack: pinned images, empty volumes, loopback-only Setup.
# `tools/clean_install.py` brings this up on empty volumes and drives the Setup Wizard to LOCKED,
# which is the V-P7-01 criterion. Secrets never live here: the master key path and every provider
# credential are supplied through the Wizard at first run.
name: agent-colab

services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_USER: ${COLAB_DB_USER:-colab}
      POSTGRES_PASSWORD: ${COLAB_DB_PASSWORD:?set COLAB_DB_PASSWORD}
      POSTGRES_DB: ${COLAB_DB_NAME:-colab}
    volumes:
      - colab-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COLAB_DB_USER:-colab} -d ${COLAB_DB_NAME:-colab}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  server:
    image: ${COLAB_SERVER_IMAGE:?set COLAB_SERVER_IMAGE to the released digest}
    environment:
      AGENT_COLAB_BOOTSTRAP_STATE_PATH: /var/lib/agent-colab/bootstrap/state.json
      AGENT_COLAB_ARTIFACT_ROOT: /var/lib/agent-colab/artifacts
      AGENT_COLAB_DOCUMENT_ROOT: /var/lib/agent-colab/documents
      AGENT_COLAB_SERVER_WORKERS: ${COLAB_SERVER_WORKERS:-4}
      AGENT_COLAB_GATEWAY_DRAIN: "1"
    volumes:
      - colab-state:/var/lib/agent-colab
    ports:
      - "127.0.0.1:${COLAB_SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Workers are started after the Setup Wizard completes: before that there is no database URL
  # and no workspace to poll, so they are behind a profile rather than crash-looping at boot.
  #   docker compose --profile workers up -d
  worker:
    image: ${COLAB_SERVER_IMAGE:?set COLAB_SERVER_IMAGE to the released digest}
    profiles: ["workers"]
    entrypoint: ["python", "-m", "server.schedules.worker"]
    command: ["--workspace", "${COLAB_WORKSPACE_ID:-}", "--runner-id", "${COLAB_RUNNER_ID:-worker-1}"]
    environment:
      AGENT_COLAB_DATABASE_URL: ${COLAB_DATABASE_URL:-}
      AGENT_COLAB_ARTIFACT_ROOT: /var/lib/agent-colab/artifacts
      AGENT_COLAB_DOCUMENT_ROOT: /var/lib/agent-colab/documents
    volumes:
      - colab-state:/var/lib/agent-colab
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  colab-db:
  colab-state:
