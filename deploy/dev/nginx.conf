server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    location /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location /api/ { proxy_pass http://server:8080/api/; proxy_set_header Host $host; }
    location /setup/ { proxy_pass http://server:8080/setup/; proxy_set_header Host $host; }

    # Vite builds the admin app with base=/admin/ while the image stores
    # assets at the web root. Serve those files before the SPA fallback;
    # otherwise browsers receive index.html as JavaScript/CSS and render blank.
    location /admin/assets/ {
        add_header Cache-Control "no-store" always;
        alias /usr/share/nginx/html/assets/;
    }
    location = /admin/favicon.svg {
        add_header Cache-Control "no-store" always;
        alias /usr/share/nginx/html/favicon.svg;
    }
    location = /admin/icons.svg {
        add_header Cache-Control "no-store" always;
        alias /usr/share/nginx/html/icons.svg;
    }
    location = / { return 302 $scheme://$http_host/admin/login; }
    location /admin/ {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
