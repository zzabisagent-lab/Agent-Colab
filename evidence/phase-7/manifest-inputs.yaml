# Inputs for the Phase 7 Evidence Manifest (validation plan §6.1); the manifest itself is generated
# by tools/run_verification.py at verification time for the exact target commit.
known_gaps:
  - "V-P7-18 (deployment approval) is half implementer, half user. The implementer side is done and evidenced: REPORT.md exists with the sections development plan §27A requires, docs/operations/deployment-decision.md records the decision state, and tools/deployment_decision.py proves the deployment ledger is empty, so no deployment preceded a decision. The user side, the explicit answer, is recorded only after the report is delivered; the record stays PENDING_USER_DECISION until then. The target is referred to as env:deploy-server: .env records a server name, an IP, an id and a password, and none of those values appear in the report, the record, the evidence or any log."
  - "V-P7-04 FAILS on one assertion of ten and is submitted failing, by the System Owner's direction of a single trial. The final run (evidence/phase-7/soak-24h.jsonl) covered the full 24.0 h to final: true with 1,441 samples and zero sampler errors, over 1,681,209 writes and 863,052 reads. Every integrity criterion held: zero 5xx, zero duplicate occurrence keys, Events, deliveries and relays, zero dead letters, zero stuck Runs, zero open work items, no stale Agents, heartbeats under 22.9 s, connections 12-24 ending at 17. Resident memory passed its ceiling and deceleration checks at 1.117x. Server private memory grew 1.149x against a 1.10x bound, which is the failure. Growth decelerated (second half +62.6 MB against the first half +89.2 MB) but had not flattened by hour 24. It is not an object leak: evidence/phase-7/soak/memory-investigation.md excludes object retention in the command path, the HTTP path and the full traffic mix, plus logging, copy-on-write un-sharing, arena proliferation and reclaimable free memory, each by measurement. The cause is not isolated. PRIVATE_GROWTH_LIMIT was not changed. Full procedure and all four attempts: docs/operations/soak-procedure.md."
  - "Image signing uses a locally held Ed25519 key generated outside the repository at ~/.local/share/agent-colab/release-signing.key; no registry and no organisational signing key exist in this environment, so trust in the public key is local. `--verify` fails rather than skips on an absent, wrong or tampered signature, and gates the recorded digests and SBOM hashes; registry publication remains a deployment step and stays a Low residual risk with an owner and a deadline."
  - "The container scan runs Trivy through Docker; where a scanner cannot run at all the scan records SCANNER_UNAVAILABLE rather than reporting clean."
  - "Peak load (V-P7-03) was measured on this build host with four API processes and two workers; the serving process count is a deployment parameter and the release notes carry the sizing rule (offered rate, not a short run's p95)."
  - "Human-path acceptance (V-P7-02, V-P7-22) drives channel surfaces only, through the provider's client-factory seam with an in-process Mattermost client; the same seam a real Team Edition instance plugs into. The clean install (V-P7-01) does contact a real Mattermost Team Edition for its preflight."
reproduction:
  - "git clone git@github.com:zzabisagent-lab/Agent-Colab.git && git checkout <target commit>"
  - "export PATH=$HOME/.local/bin:$PATH; export AGENT_COLAB_TEST_DATABASE_URL=postgresql://colab@127.0.0.1:54329/colab_test"
  - "make ci   # lint, tests, doc checks, build; sidecar: uv run pytest sidecar/tests -q"
  - "Every V-P7 Test has a SELF evidence attempt under evidence/phase-7/SELF-V-P7-NN/attempt-NN/result.json; the latest attempt of each is PASS"
  - "Release build and scans: uv run python -m tools.release_build --version <v>; uv run python -m tools.security_scan --require"
  - "Clean production install (V-P7-01): COLAB_SERVER_IMAGE=<image> COLAB_MATTERMOST_URL=<url> COLAB_MATTERMOST_BOT_TOKEN=<token> uv run python -m tools.clean_install --run"
  - "Backup, restore, upgrade (V-P7-07..10, 19, 20): uv run pytest tests/integration/test_recovery_db.py tests/integration/test_upgrade_rollback.py -q"
  - "Load and soak (V-P7-03/04): uv run python -m tests.load.run --profile peak --minutes 30; observability (V-P7-14): uv run pytest tests/integration/test_observability_alerts_db.py -q"
  - "Runbooks, tabletop and acceptance (V-P7-13/21/02/22): uv run pytest tests/e2e/test_incident_tabletop.py tests/e2e/test_human_path_acceptance.py -q; uv run python -m tools.runbook_lint"
  - "Evidence archive and residual risks (V-P7-16/17): uv run python -m tools.evidence_archive --check --phases 7"
  - "Report and deployment decision (V-P7-18): uv run python -m tools.deployment_decision --check; uv run pytest tests/e2e/test_release_evidence.py -q"
  - "Soak (V-P7-04): the full procedure, every attempt and its outcome, and the open memory question are recorded in docs/operations/soak-procedure.md"
