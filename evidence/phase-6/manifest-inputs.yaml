# Inputs for the Phase 6 Evidence Manifest (validation plan §6.1); the manifest itself is generated
# by tools/run_verification.py at verification time for the exact target commit.
known_gaps:
  - "Only Task documents reach FINALIZED: the DOCUMENT_FINALIZED Event requires a verification_id and only Tasks have a VerificationRun, so Brainstorm, Schedule Run and period documents stay drafts gated by the publish review rather than weakening the Phase 1 Event contract."
  - "The reference wiki connector (V-P6-21) is BookStack, exercised against its HTTP API through an injectable transport so the contract tests run offline; Wiki.js keeps the same adapter contract but is not implemented."
  - "Malware scanning uses a signature scanner in tests and a ClamAV client when a socket is configured; a scan that cannot run quarantines the artifact rather than passing it (ARTIFACT_SCAN_UNAVAILABLE)."
  - "The Git publisher pushes into a local bare repository in the tests; Gitea or another remote is a configuration change, not a code path."
  - "Narrative paragraphs come from a Documentation Agent with the document.narrate capability; when none is available or it declines, the skeleton-only document is a valid draft and the reason code is recorded."
  - "V-P6-13 canary redaction covers canonical and published documents plus captured logs; the raw fixture that carries the canary is excluded by design."
reproduction:
  - "git clone git@github.com:zzabisagent-lab/Agent-Colab.git && git checkout <target commit>"
  - "export PATH=$HOME/.local/bin:$PATH; export AGENT_COLAB_TEST_DATABASE_URL=postgresql://colab@127.0.0.1:54329/colab_test (any empty PostgreSQL 16 maintenance DB; the test session creates and drops its own database and runs migrations 0001-0021)"
  - "make ci   # lint, tests, doc checks, build; sidecar: uv run pytest sidecar/tests -q"
  - "Every V-P6 Test has a SELF evidence attempt under evidence/phase-6/SELF-V-P6-NN/attempt-NN/result.json listing the exact command; the latest attempt of each ID is PASS"
  - "Approvals (V-P6-01/02/22/29): uv run pytest tests/integration/test_approval_collaboration_db.py -q"
  - "Brainstorm (V-P6-03/04/26/27): uv run pytest tests/unit/test_brainstorm_limits.py tests/integration/test_brainstorm_engine_db.py tests/integration/test_brainstorm_decisions_db.py -q"
  - "Documents (V-P6-07..14, 19, 20, 23, 24, 28): uv run pytest tests/integration/test_document_finalizer_db.py tests/integration/test_document_provenance_db.py tests/integration/test_document_redaction_db.py tests/integration/test_document_rate_db.py tests/integration/test_schedule_period_summary_db.py tests/unit/test_narrative_citations.py -q"
  - "Artifacts and publishers (V-P6-05/06/15/16/17/18/21/25): uv run pytest tests/unit/test_artifact_malicious_fixtures.py tests/integration/test_artifact_upload_db.py tests/integration/test_artifact_quarantine_db.py tests/integration/test_artifact_links_phase6_db.py tests/integration/test_publisher_filesystem_git_db.py tests/integration/test_publisher_connector.py -q"
