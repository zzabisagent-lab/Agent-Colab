reproduction:
  - "git clone git@github.com:zzabisagent-lab/Agent-Colab.git && git checkout <target commit>"
  - "export PATH=$HOME/.local/bin:$PATH; export AGENT_COLAB_TEST_DATABASE_URL=postgresql://colab@127.0.0.1:54329/colab_test (any empty PostgreSQL 16 maintenance DB; tests create/drop their own databases)"
  - "make bootstrap && make lint && make test && make check-docs && make build"
  - "bash tools/clean_bootstrap_check.sh HEAD  (V-P0-03: fresh clone + full pipeline)"
  - "uv run python -m tools.trace_matrix --check; uv run python -m tools.criteria_lint; uv run python -m tools.phase_dag_lint; uv run python -m tools.plan_baseline_lint; uv run python -m tools.policy_lint; uv run python -m tools.threat_model_lint; uv run python -m tools.name_role_lint"
  - "gitleaks git --no-banner --redact . && gitleaks dir --no-banner --redact .  (V-P0-09)"
  - "uv run pytest tests/integration/test_verification_harness.py -q  (V-P0-07, needs the DB URL)"
  - "MCP spike (V-P0-17): SPIKE_PORT=8767 uv run python -m spikes.mcp.server & then uv run python -m spikes.mcp.client; logs in evidence/phase-0/spikes/mcp/"
  - "Mattermost spike (V-P0-16): docs/protocol/mattermost-spike.md; scripts/dev/mattermost-local.sh start|stop"
