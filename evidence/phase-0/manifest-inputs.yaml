  - "V-P0-19 (Telegram API spike, P0-13): no Telegram bot token or test chats exist in .env or the environment; the spike cannot be executed and P0-13 is BLOCKED. Blocker B-002 raised to the user."
  - "P0-10 spike used a locally provisioned Mattermost Team Edition 11.10.1 (self-provisioned test team) instead of an externally supplied test team (ADR-0003)."
