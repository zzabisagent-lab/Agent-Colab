# Agent-Colab secret scanning configuration (P0-06 / V-P0-09).
# Extends the gitleaks default rule set; only the documented DLP canary pattern and the
# baseline documents' example YAML are allow-listed. Real credentials are never allow-listed.
title = "Agent-Colab gitleaks config"

[extend]
useDefault = true

# Exceptions documented in docs/security/secret-scan.md: test canaries, baseline example snippets,
# fixture hashes/keys of fake data, and the two pre-remediation commits of Finding F-P0-002-02
# (revoked local test-instance callback material; later commits carry redacted copies only).
[[allowlists]]
description = "Documented test canaries, baseline snippets, fixture hashes, and revoked spike material"
regexTarget = "line"
regexes = [
  # RFC 6238 Appendix B published TOTP test vector (base32 of "12345678901234567890"), not a secret
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',
  '''CANARY-NOT-A-SECRET-\d+''',
  '''token_hash: "[0-9a-f]{64}"''',
  '''"idempotency_key": "[a-z]+-\d{4}-[a-z]+-\d+"''',
  # keyword argument text in tests (`idempotency_key=key`), not a credential
  '''idempotency_key=key\b''',
]
paths = [
  # local, git-ignored deployment-secrets file (never tracked: `git check-ignore .env`); the
  # directory scan walks ignored files, the history scan is the authoritative repository check
  '''^\.env$''',
  '''^docs/baseline/.*\.md$''',
  # Bridge redaction-rule fixture: synthetic AWS/bearer/DSN samples the redactor must catch
  '''^tests/fixtures/bridge/rules\.yaml$''',
  '''(^|/)\.venv/''',
  '''(^|/)node_modules/''',
]
commits = [
  "0e43f203558b3b275de600f668cf59a45b3d5f10",
  "4c1adf6258be01e73e569c2cdf2680fffc4211eb",
]

# Provider callback material (Finding F-P0-002-02): Mattermost slash-command tokens, trigger IDs
# and response_url hook capabilities must never be committed unredacted.
[[rules]]
id = "agent-colab-mattermost-callback-material"
description = "Mattermost slash-command token / trigger_id / response_url hook id in evidence or fixtures"
regex = '''(?i)"(token|trigger_id)"\s*:\s*"[A-Za-z0-9+/=_-]{20,}"|/hooks/commands/[A-Za-z0-9]{20,}'''

# Verifier transcripts and evidence (stored unmodified) quote commit SHAs; the default Sourcegraph
# rule mistakes bare 40-hex strings for tokens. Scoped to that rule, those paths and that shape only
# (Finding F-P4-002-01).
[[allowlists]]
description = "commit SHAs inside verifier transcripts/evidence are not Sourcegraph tokens"
targetRules = ["sourcegraph-access-token"]
regexTarget = "match"
regexes = ['''^[0-9a-f]{40}$''']
paths = [
  '''^verification/phase-\d+/(run-r\d+/events\.jsonl|evidence-r\d+/[^/]+|VR-P\d-\d{3}\.yaml)$''',
]
