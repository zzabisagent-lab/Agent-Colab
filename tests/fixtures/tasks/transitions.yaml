# Table-driven transition cases (V-P1-27). `expect` is the next status or an error code.
# Every (status, event) pair not listed as allowed below is generated as a rejection case by the
# test (TASK_TERMINAL for COMPLETED/CANCELLED, TASK_TRANSITION_INVALID otherwise).
allowed:
  - {from: OPEN, event: TASK_DELEGATED, to: DELEGATED}
  - {from: DELEGATED, event: TASK_REASSIGNED, to: DELEGATED}
  - {from: DELEGATED, event: TASK_ACCEPTED, to: ACCEPTED}
  - {from: ACCEPTED, event: TASK_STARTED, to: RUNNING}
  - {from: RUNNING, event: TASK_WAITING, to: WAITING}
  - {from: WAITING, event: TASK_STARTED, to: RUNNING}
  - {from: RUNNING, event: TASK_PROGRESS_REPORTED, to: RUNNING}
  - {from: RUNNING, event: IMPLEMENTATION_SUBMITTED, to: IMPLEMENTED}
  - {from: IMPLEMENTED, event: TASK_VERIFICATION_STARTED, to: VERIFYING}
  - {from: VERIFYING, event: VERIFICATION_PASSED, to: VERIFIED}
  - {from: VERIFYING, event: VERIFICATION_FAILED, to: RUNNING}
  - {from: VERIFYING, event: VERIFICATION_BLOCKED, to: WAITING}
  - {from: VERIFIED, event: TASK_COMPLETED, to: COMPLETED}
  - {from: OPEN, event: TASK_CANCELLED, to: CANCELLED}
  - {from: DELEGATED, event: TASK_CANCELLED, to: CANCELLED}
  - {from: ACCEPTED, event: TASK_CANCELLED, to: CANCELLED}
  - {from: RUNNING, event: TASK_CANCEL_REQUESTED, to: CANCEL_REQUESTED}
  - {from: WAITING, event: TASK_CANCEL_REQUESTED, to: CANCEL_REQUESTED}
  - {from: IMPLEMENTED, event: TASK_CANCEL_REQUESTED, to: CANCEL_REQUESTED}
  - {from: VERIFYING, event: TASK_CANCEL_REQUESTED, to: CANCEL_REQUESTED}
  - {from: CANCEL_REQUESTED, event: TASK_CANCELLED, to: CANCELLED}
events:
  - TASK_DELEGATED
  - TASK_REASSIGNED
  - TASK_ACCEPTED
  - TASK_STARTED
  - TASK_WAITING
  - TASK_PROGRESS_REPORTED
  - IMPLEMENTATION_SUBMITTED
  - TASK_VERIFICATION_STARTED
  - VERIFICATION_PASSED
  - VERIFICATION_FAILED
  - VERIFICATION_BLOCKED
  - TASK_COMPLETED
  - TASK_CANCEL_REQUESTED
  - TASK_CANCELLED
flows:
  - name: normal
    events: [TASK_DELEGATED, TASK_ACCEPTED, TASK_STARTED, TASK_PROGRESS_REPORTED, IMPLEMENTATION_SUBMITTED, TASK_VERIFICATION_STARTED, VERIFICATION_PASSED, TASK_COMPLETED]
    final: COMPLETED
  - name: failed-then-recheck
    events: [TASK_DELEGATED, TASK_ACCEPTED, TASK_STARTED, IMPLEMENTATION_SUBMITTED, TASK_VERIFICATION_STARTED, VERIFICATION_FAILED, IMPLEMENTATION_SUBMITTED, TASK_VERIFICATION_STARTED, VERIFICATION_PASSED, TASK_COMPLETED]
    final: COMPLETED
  - name: blocked-then-resume
    events: [TASK_DELEGATED, TASK_ACCEPTED, TASK_STARTED, IMPLEMENTATION_SUBMITTED, TASK_VERIFICATION_STARTED, VERIFICATION_BLOCKED, TASK_STARTED, IMPLEMENTATION_SUBMITTED, TASK_VERIFICATION_STARTED, VERIFICATION_PASSED]
    final: VERIFIED
  - name: cancel-during-execution
    events: [TASK_DELEGATED, TASK_ACCEPTED, TASK_STARTED, TASK_CANCEL_REQUESTED, TASK_CANCELLED]
    final: CANCELLED
  - name: cancel-before-execution
    events: [TASK_DELEGATED, TASK_CANCELLED]
    final: CANCELLED
