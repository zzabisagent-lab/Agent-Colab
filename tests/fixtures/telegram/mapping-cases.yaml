# Bridge thread-mapping cases (V-P0-19 / P2-05 contract). `existing` lists prior mappings by name.
bridges:
  bi: {bridge_id: bridge-1, mm_channel_id: mmchan-A, tg_chat_id: chat-A, direction: bidirectional}
  bi_general: {bridge_id: bridge-2, mm_channel_id: mmchan-A, tg_chat_id: chat-A, direction: bidirectional, tg_thread_mode: general}
  bi_fixed: {bridge_id: bridge-3, mm_channel_id: mmchan-A, tg_chat_id: chat-A, direction: bidirectional, tg_thread_mode: fixed_topic, tg_fixed_thread_id: 77}
  mm_only: {bridge_id: bridge-4, mm_channel_id: mmchan-A, tg_chat_id: chat-A, direction: mattermost_to_telegram}
  tg_only: {bridge_id: bridge-5, mm_channel_id: mmchan-A, tg_chat_id: chat-A, direction: telegram_to_mattermost}
  disabled: {bridge_id: bridge-6, mm_channel_id: mmchan-A, tg_chat_id: chat-A, direction: bidirectional, enabled: false}
mappings:
  root1:   {bridge_id: bridge-1, source_platform: mattermost, source_message_id: post-root-1, origin_platform: mattermost, origin_message_id: post-root-1, hop_count: 1, mm_channel_id: mmchan-A, mm_post_id: post-root-1, mm_root_id: null, tg_chat_id: chat-A, tg_message_id: 4, tg_thread_id: 3, tg_reply_to_message_id: null}
  reply1:  {bridge_id: bridge-1, source_platform: mattermost, source_message_id: post-reply-1, origin_platform: mattermost, origin_message_id: post-reply-1, hop_count: 1, mm_channel_id: mmchan-A, mm_post_id: post-reply-1, mm_root_id: post-root-1, tg_chat_id: chat-A, tg_message_id: 5, tg_thread_id: 3, tg_reply_to_message_id: 4}
  tgroot:  {bridge_id: bridge-1, source_platform: telegram, source_message_id: "9", origin_platform: telegram, origin_message_id: "9", hop_count: 1, mm_channel_id: mmchan-A, mm_post_id: post-from-tg-9, mm_root_id: null, tg_chat_id: chat-A, tg_message_id: 9, tg_thread_id: 8, tg_reply_to_message_id: null}
  general: {bridge_id: bridge-2, source_platform: mattermost, source_message_id: post-g-1, origin_platform: mattermost, origin_message_id: post-g-1, hop_count: 1, mm_channel_id: mmchan-A, mm_post_id: post-g-1, mm_root_id: null, tg_chat_id: chat-A, tg_message_id: 12, tg_thread_id: null, tg_reply_to_message_id: null}
cases:
  - {name: mm root creates a topic, bridge: bi, event: {platform: mattermost, message_id: post-new, sender_name: alice, mm_channel_id: mmchan-A}, expect: {platform: telegram, tg_thread_id: null, create_topic: true, display_prefix: "[alice via Mattermost]"}}
  - {name: mm root in general mode omits thread id, bridge: bi_general, event: {platform: mattermost, message_id: post-new, sender_name: alice, mm_channel_id: mmchan-A}, expect: {platform: telegram, tg_thread_id: null, create_topic: false, send_params_has_thread: false}}
  - {name: mm root in fixed-topic mode, bridge: bi_fixed, event: {platform: mattermost, message_id: post-new, sender_name: alice, mm_channel_id: mmchan-A}, expect: {platform: telegram, tg_thread_id: 77, create_topic: false, send_params_has_thread: true}}
  - {name: mm reply goes into the mapped topic with reply_parameters, bridge: bi, existing: [root1], event: {platform: mattermost, message_id: post-reply-9, sender_name: bob, mm_channel_id: mmchan-A, mm_root_id: post-root-1}, expect: {platform: telegram, tg_thread_id: 3, tg_reply_to_message_id: 4, create_topic: false}}
  - {name: mm reply to unmapped root is unmapped, bridge: bi, event: {platform: mattermost, message_id: post-reply-9, sender_name: bob, mm_channel_id: mmchan-A, mm_root_id: post-unknown}, error: BRIDGE_TARGET_UNMAPPED}
  - {name: mm post in another channel is unmapped, bridge: bi, event: {platform: mattermost, message_id: post-x, sender_name: bob, mm_channel_id: mmchan-B}, error: BRIDGE_TARGET_UNMAPPED}
  - {name: mm duplicate source rejected, bridge: bi, existing: [root1], event: {platform: mattermost, message_id: post-root-1, sender_name: alice, mm_channel_id: mmchan-A}, error: BRIDGE_DUPLICATE_SOURCE}
  - {name: mm post authored by the bridge bot is a loop, bridge: bi, event: {platform: mattermost, message_id: post-bot, sender_name: agent-colab, mm_channel_id: mmchan-A, is_bridge_bot: true}, error: BRIDGE_LOOP_DETECTED}
  - {name: mm post carrying a telegram origin marker is a loop, bridge: bi, event: {platform: mattermost, message_id: post-r, sender_name: alice, mm_channel_id: mmchan-A, origin_platform: telegram, origin_message_id: "9"}, error: BRIDGE_LOOP_DETECTED}
  - {name: hop count 1 is never relayed again, bridge: bi, event: {platform: mattermost, message_id: post-r, sender_name: alice, mm_channel_id: mmchan-A, hop_count: 1}, error: BRIDGE_LOOP_DETECTED}
  - {name: mm to tg denied on tg-only bridge, bridge: tg_only, event: {platform: mattermost, message_id: post-new, sender_name: alice, mm_channel_id: mmchan-A}, error: BRIDGE_DIRECTION_DENIED}
  - {name: tg to mm denied on mm-only bridge, bridge: mm_only, event: {platform: telegram, message_id: "20", sender_name: carol, tg_chat_id: chat-A, tg_thread_id: 3}, error: BRIDGE_DIRECTION_DENIED}
  - {name: disabled bridge relays nothing, bridge: disabled, event: {platform: telegram, message_id: "20", sender_name: carol, tg_chat_id: chat-A}, error: BRIDGE_DIRECTION_DENIED}
  - {name: tg message in mapped topic becomes a thread reply, bridge: bi, existing: [root1], event: {platform: telegram, message_id: "20", sender_name: carol, tg_chat_id: chat-A, tg_thread_id: 3}, expect: {platform: mattermost, mm_root_id: post-root-1, display_prefix: "[carol via Telegram]"}}
  - {name: tg reply to a mapped reply lands in its thread, bridge: bi, existing: [root1, reply1], event: {platform: telegram, message_id: "21", sender_name: carol, tg_chat_id: chat-A, tg_thread_id: 3, tg_reply_to_message_id: 5}, expect: {platform: mattermost, mm_root_id: post-root-1}}
  - {name: tg reply to the mapped root lands in its thread, bridge: bi, existing: [root1], event: {platform: telegram, message_id: "22", sender_name: carol, tg_chat_id: chat-A, tg_thread_id: 3, tg_reply_to_message_id: 4}, expect: {platform: mattermost, mm_root_id: post-root-1}}
  - {name: tg message in unmapped topic becomes a new root post, bridge: bi, event: {platform: telegram, message_id: "30", sender_name: carol, tg_chat_id: chat-A, tg_thread_id: 99}, expect: {platform: mattermost, mm_root_id: null}}
  - {name: tg general-topic message becomes a new root post, bridge: bi, event: {platform: telegram, message_id: "31", sender_name: carol, tg_chat_id: chat-A, tg_thread_id: null}, expect: {platform: mattermost, mm_root_id: null}}
  - {name: tg message in a topic that a tg root created is a reply, bridge: bi, existing: [tgroot], event: {platform: telegram, message_id: "40", sender_name: dave, tg_chat_id: chat-A, tg_thread_id: 8}, expect: {platform: mattermost, mm_root_id: post-from-tg-9}}
  - {name: tg message from another chat is unmapped, bridge: bi, event: {platform: telegram, message_id: "50", sender_name: carol, tg_chat_id: chat-B, tg_thread_id: 3}, error: BRIDGE_TARGET_UNMAPPED}
  - {name: tg duplicate source rejected, bridge: bi, existing: [tgroot], event: {platform: telegram, message_id: "9", sender_name: carol, tg_chat_id: chat-A, tg_thread_id: 8}, error: BRIDGE_DUPLICATE_SOURCE}
  - {name: tg message from the bridge bot is a loop, bridge: bi, event: {platform: telegram, message_id: "60", sender_name: agent-colab, tg_chat_id: chat-A, tg_thread_id: 3, is_bridge_bot: true}, error: BRIDGE_LOOP_DETECTED}
  - {name: tg message with mattermost origin marker is a loop, bridge: bi, event: {platform: telegram, message_id: "61", sender_name: carol, tg_chat_id: chat-A, origin_platform: mattermost, origin_message_id: post-root-1}, error: BRIDGE_LOOP_DETECTED}
  - {name: general-mode mm reply replies to the mapped general message, bridge: bi_general, existing: [general], event: {platform: mattermost, message_id: post-g-reply, sender_name: alice, mm_channel_id: mmchan-A, mm_root_id: post-g-1}, expect: {platform: telegram, tg_thread_id: null, tg_reply_to_message_id: 12, send_params_has_thread: false}}
  - {name: loop check runs before direction check, bridge: tg_only, event: {platform: mattermost, message_id: post-bot, sender_name: x, mm_channel_id: mmchan-A, is_bridge_bot: true}, error: BRIDGE_LOOP_DETECTED}
  - {name: direction check runs before duplicate check, bridge: mm_only, existing: [tgroot], event: {platform: telegram, message_id: "9", sender_name: carol, tg_chat_id: chat-A, tg_thread_id: 8}, error: BRIDGE_DIRECTION_DENIED}
