  - {code: AGENT_SELECTION_INVALID, selection: {mode: capability, required_capabilities: []}}
  - {code: AGENT_SELECTION_INVALID, selection: {mode: random}}
  - {code: AGENT_SELECTION_INVALID, selection: {mode: fixed, agent_id: "not-prefixed"}}
