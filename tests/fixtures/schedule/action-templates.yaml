agent_selection_valid:
  - {mode: fixed, agent_id: agent-research-1}
  - {mode: fixed, agent_id: agent-research-1, fallback: true}
  - {mode: capability, required_capabilities: [research.summarize]}
  - {mode: capability, required_capabilities: [research.summarize, artifact.write], domain: research, exclude_agent_ids: [agent-x]}
agent_selection_invalid:
