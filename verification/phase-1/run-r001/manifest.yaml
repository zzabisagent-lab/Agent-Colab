known_gaps:
- 'Verifier assignment (§7D.2) is Phase 3 (P3-13): Phase 1 VerificationRuns are created
  with explicit verifier identities; independence, snapshots, revisions and the completion
  gate are complete.'
- Notification providers (Mattermost DM/mention, SMTP) are stubbed (P1-13 by design);
  the rules engine, dedupe, digest, reminders and outbox drain are exercised with
  a stub provider.
- MCP resource subscriptions are unsupported by the pinned SDK protocol pairing (Phase
  0 decision); work_poll long-poll is the delivery path; the Phase 1 MCP surface covers
  task_create/delegate/accept/progress, implementation_submit, approval_request (remaining
  §7.4 tools arrive with P3-10/P6).
- Envelope encryption uses an instance master key from configuration (AGENT_COLAB_MASTER_KEY_B64);
  the Secret provider interface and key custody arrive in Phase 4 (P4-05).
- Projection rebuilds tolerate raw Event streams that bypassed the command handlers
  by skipping and reporting them (only possible from outside the API); the integrity
  job reports such streams.
