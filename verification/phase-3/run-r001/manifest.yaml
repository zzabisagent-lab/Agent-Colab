known_gaps:
- Adapter conformance (V-P3-05) runs the three built-in types (mcp, webhook, mattermost_bot)
  and the plugin type against in-process simulation harnesses (server/agents/conformance/harness*.py)
  with a virtual clock; no external Agent product is contacted. The webhook harness
  verifies the server's HMAC signatures like a real endpoint; the bot harness feeds
  the adapter's message sink.
- 'mTLS for the MCP transport is terminated at a reverse proxy (Phase 5 deployment):
  the server verifies the proxy-asserted client-certificate fingerprint header only
  when AGENT_COLAB_MTLS_HEADER and AGENT_COLAB_MTLS_PROXY_SECRET are configured; a
  forged header without the proxy secret is rejected (tested).'
- Webhook signing keys are resolved through the SigningKeyResolver seam (env-backed
  EnvSigningKeyResolver keyed by credential_ref) until the Phase 4 Secret Broker;
  only credential references are stored.
- MCP tools brainstorm_contribute and the management tools (agent_register, principal_role_assign,
  channel_configure, bridge_configure, secret_grant_create) are Phase 4 / admin-capability
  work; the corresponding REST endpoints exist for agents, roles, channels and bridges.
- Periodic sweeps (work-item timeouts → re-routing, verifier offer timeouts, offline
  detection) run from the API process gateway loop (AGENT_COLAB_MAINTENANCE_INTERVAL_S,
  default 30 s); a separate worker is a deployment option.
- Channel deletion and Agent lifecycle history rebuilds re-fold Event streams into
  authority-table columns rather than the generic projection runner (foreign keys
  on agents).
