reproduction:
- git clone git@github.com:zzabisagent-lab/Agent-Colab.git && git checkout <target
  commit>
- export PATH=$HOME/.local/bin:$PATH; export AGENT_COLAB_TEST_DATABASE_URL=postgresql://colab@127.0.0.1:54329/colab_test
  (any empty PostgreSQL 16 maintenance DB; the test session creates and drops its
  own database and runs migrations 0001-0011)
- make bootstrap && make lint && make test && make check-docs && make build
- Every V-P3 Test has a SELF evidence attempt under evidence/phase-3/SELF-V-P3-NN/attempt-NN/result.json
  listing the exact command; the latest attempt of each ID is PASS
- 'Adapter conformance (all three types + plugin): uv run pytest tests/unit/test_conformance_suite.py
  tests/unit/test_conformance_push_harnesses.py tests/integration/test_adapter_plugin.py
  -q; CLI: uv run python -m server.agents.conformance --adapter webhook --endpoint
  ''{}'''
- 'Registry/roles/limits: uv run pytest tests/integration/test_agents_db.py tests/integration/test_roles_api.py
  tests/integration/test_agent_limits.py tests/unit/test_agent_registry.py -q'
- 'MCP transport (real server on a loopback port): uv run pytest tests/integration/test_mcp_transport.py
  -q; webhook/bot delivery: tests/integration/test_webhook_delivery.py tests/integration/test_bot_adapter_db.py'
- 'Routing/orchestration/re-routing/verifier assignment: uv run pytest tests/unit/test_routing.py
  tests/integration/test_routing_db.py tests/integration/test_orchestration_db.py
  tests/integration/test_rerouting_db.py tests/integration/test_verifier_assignment_db.py
  -q'
- 'Agent Admin UI (V-P3-13): cd web-admin && pnpm install && pnpm run build; PLAYWRIGHT_CHROMIUM_EXECUTABLE=<chromium>
  uv run pytest tests/e2e/test_admin_agents_ui.py -q'
