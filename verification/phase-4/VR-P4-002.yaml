findings:
  - id: F-P4-002-01
    severity: Low
    affected: [repository-secret-scan]
    summary: "The default repository history secret scan reports commit hashes in the prior verifier event log as Sourcegraph tokens."
    reproduction:
      - "Check out target commit 4e774efd1500db7ba444679d684e92def376225e."
      - "Run gitleaks git --no-banner --redact --verbose ."
      - "Observe seven sourcegraph-access-token matches, all in verification/phase-4/run-r001/events.jsonl and all corresponding to commit SHA text."
    expected: "The configured repository history scan exits zero when tracked content contains no credentials."
    actual: "The scan exits one on seven redacted false positives caused by commit SHA strings in a checked-in verifier transcript."
    evidence_ref: verification/phase-4/evidence-r002/gitleaks-verbose.log
    impact: "Secret-scan automation is noisy and may block a repository gate, but the matched strings are public commit identifiers rather than credentials."
    fix_condition: "Exclude generated verifier transcript fields narrowly or store a redacted transcript form, then demonstrate the configured gitleaks history scan exits zero without broad credential allowlisting."
    owner: agent-claude-code
    deadline: "before Phase 5 completion"
result: PASSED
