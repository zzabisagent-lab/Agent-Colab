known_gaps:
- OIDC is an adapter interface with a fake provider in tests (development plan §9.2
  optional); TOTP MFA is the enforced factor for System Owner/Administrator and is
  mandatory for critical actions.
- mTLS for /setup and the MCP transport is terminated at a reverse proxy (Phase 5
  deployment); the server enforces the proxy-asserted client-certificate fingerprint
  and refuses forged headers without the proxy secret. The V-P4-27 boundary matrix
  is evaluated on request attributes (bind address, TLS/proxy headers, client-cert
  assertion, allowlist, token).
- The encrypted local provider is the only Secret provider implemented; an external
  provider registers through the same contract (server/secrets/provider.py). Backups
  exclude the master and ledger keys; V-P4-17 shows a dump plus runtime tokens cannot
  decrypt secret versions.
- The secret sidecar is verified against an in-process fake Broker implementing docs/protocol/secret-sidecar-api.md
  and against the real HTTP contract over loopback; the OCI image is built from sidecar/Dockerfile
  but not pushed to a registry in this environment.
- Dependency probes for Telegram and SMTP report `unconfigured` rather than failures
  when no endpoint is configured; Mattermost probes use the local Team Edition (scripts/dev/mattermost-local.sh).
- Accessibility (V-P4-18) is measured with axe-core WCAG 2.1 A/AA rules on every console
  route plus keyboard-only critical flows; manual contrast review is limited to the
  default theme.
- Hard delete for Artifacts/Documents unlinks blob files and shreds DEKs; rows stay
  with a display-redaction tombstone (Events are never rewritten, V-P4-25).
