- git clone git@github.com:zzabisagent-lab/Agent-Colab.git && git checkout <target
  commit>
- export PATH=$HOME/.local/bin:$PATH; export AGENT_COLAB_TEST_DATABASE_URL=postgresql://colab@127.0.0.1:54329/colab_test
  (any empty PostgreSQL 16 maintenance DB; the test session creates and drops its
  own database and runs migrations 0001-0015)
- 'make bootstrap && make lint && make test && make check-docs && make build; sidecar:
  uv run pytest sidecar/tests -q'
- Every V-P4 Test has a SELF evidence attempt under evidence/phase-4/SELF-V-P4-NN/attempt-NN/result.json
  listing the exact command; the latest attempt of each ID is PASS
- 'Setup Wizard (V-P4-01..04/19/24/27/28/30): uv run pytest tests/integration/test_setup_wizard_db.py
