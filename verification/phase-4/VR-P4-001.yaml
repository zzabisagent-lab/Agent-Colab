findings:
  - id: F-P4-001
    severity: Medium
    affected: [REQ-SETP-001, V-P4-01]
    summary: "The Web Setup Wizard cannot execute the server's Setup protocol."
    target_commit: a488dfe25ab39358e207307ecc394729ae8f403f
    environment: "environment_fingerprint above; clean target checkout"
    reproduction:
      - "Open web-admin/src/features/setup/SetupWizardPage.tsx and observe no calls to POST /setup/configure."
      - "Submit the UI-shaped form body to POST /setup/preflight and POST /setup/diff, then submit it to POST /setup/bootstrap."
      - "Observe preflight ok=false with missing DB inputs, HTTP 405 for diff, and HTTP 422 for bootstrap."
    expected: "A clean environment can be fully configured and locked through the Web Wizard within 30 minutes."
    actual: "The UI sends request methods and bodies incompatible with server/api/setup.py, so the Web flow cannot reach a successful preflight or bootstrap."
    evidence_ref: verification/phase-4/evidence-r001/repro-web-setup-contract-attempt3.log
    impact: "Initial operators cannot install Agent-Colab through the mandated Web Wizard; only the lower-level API harness succeeds."
    fix_condition: "Wire each form section through POST /setup/configure, call GET /setup/diff, send {token} to POST /setup/bootstrap, and add a browser E2E test that configures an empty DB/storage and reaches LOCKED."
  - id: F-P4-002
    severity: Medium
    affected: [REQ-SETP-002, V-P4-02]
    summary: "Pre-DB Setup token rejection records are discarded instead of becoming AuditEvents."
    target_commit: a488dfe25ab39358e207307ecc394729ae8f403f
    environment: "environment_fingerprint above; empty PostgreSQL 16 database"
    reproduction:
      - "Create a fresh Wizard and submit an invalid setup token before DB migration."
      - "Complete a valid bootstrap to LOCKED."
      - "Query audit_events for action='setup.token_rejected'."
    expected: "Exactly one redacted AuditEvent exists for every rejected token request."
    actual: "The query returns zero; the pre-DB rejection exists only in rejection_log and is removed when the local file becomes a LOCKED marker."
    evidence_ref: verification/phase-4/evidence-r001/repro-setup-rejection-audit-attempt2.log
    impact: "Setup takeover attempts before DB availability are absent from the authoritative audit trail."
    fix_condition: "Atomically migrate every sealed pre-DB rejection entry into redacted audit_events when the DB becomes available, prove one event per request including 429 responses, and retain retry/idempotency safety."
  - id: F-P4-003
    severity: Low
    affected: [REQ-QGAT-004, make-ci]
    summary: "The documented clean-clone CI gate fails Ruff lint."
    target_commit: a488dfe25ab39358e207307ecc394729ae8f403f
    environment: "environment_fingerprint above; clean local clone"
    reproduction:
      - "Check out the target commit in a clean clone."
      - "Run make ci."
      - "Observe Ruff E501 at tests/integration/test_maintenance_db.py:28 and exit code 2."
    expected: "make ci completes successfully as required by repository agreements and reproduction steps."
    actual: "make ci stops during ruff check because line 28 is 103 characters, exceeding the configured 100-character limit."
    evidence_ref: verification/phase-4/evidence-r001/make-ci.log
    impact: "The target cannot pass its required CI gate and the manifest's lint-green assertion is not reproducible."
    fix_condition: "Format the offending statement and demonstrate make ci exits 0 from a clean target checkout."
