findings:
  - id: F-P0-002-01
    severity: Medium
    affected: [REQ-AGENT-007, V-P0-17]
    summary: MCP long-poll response exceeds the mandatory 30-second bound.
    reproduction:
      - Run SPIKE_PORT=8877 uv run python -m spikes.mcp.server.
      - Run SPIKE_PORT=8877 uv run python -m spikes.mcp.client against the fresh server.
      - Observe a_empty_poll elapsed_s in the client log.
    expected: The empty long-poll response completes within 30 seconds.
    actual: The response completed in 30.083 seconds; the client assertion permits up to 30.5 seconds and therefore did not catch the criterion violation.
    evidence_ref: verification/phase-0/evidence-r002/V-P0-17-mcp-client.log
    impact: Agents can observe delivery-poll latency beyond the fixed contract, and the automated spike can report success while the mandatory timing criterion is violated.
    fix_condition: Bound the server wait below the end-to-end deadline or otherwise guarantee end-to-end response at or below 30.000 seconds, tighten the assertion to the criterion, and rerun V-P0-17 successfully.
  - id: F-P0-002-02
    severity: Medium
    affected: [REQ-THRT-001, V-P0-09]
    summary: Committed Mattermost spike evidence is not fully secret-safe.
    reproduction:
      - Inspect evidence/phase-0/spikes/mattermost/slash-command-delivery.json without printing its values.
      - Identify callback-capability fields retained as issued values while the command token alone is redacted.
      - Compare with docs/protocol/mattermost-spike.md, which states every token value was replaced by <redacted>.
    expected: Evidence contains no real secret values or recoverable capability fragments, and all issued callback material is redacted.
    actual: Live-issued callback material remains committed in the spike artifact; values are intentionally omitted from this report.
    evidence_ref: evidence/phase-0/spikes/mattermost/slash-command-delivery.json
    impact: Anyone with repository read access receives test-tenant callback capability material; even if short-lived or expired, immutable history retains values that evidence policy forbids committing.
    fix_condition: Revoke or expire affected test credentials, purge or replace the sensitive artifact under the repository's incident procedure, commit fully redacted evidence, and rerun both history and directory secret review.
  - id: F-P0-002-03
    severity: Low
    affected: [V-P0-03, V-P0-10]
    summary: Implementer Evidence Manifest is pinned to an earlier commit than the verification target.
    reproduction:
      - Run git rev-parse HEAD.
      - Compare the result with commit_sha in evidence/phase-0/manifest.yaml.
    expected: The phase implementation manifest identifies the exact target commit being submitted for verification.
    actual: The manifest identifies 217491bbd1121eec42a370ed19c22d02a1fef54e while the target is 9f7f1270db54b9bae3ed375a1861fc16652fb92b.
    evidence_ref: verification/phase-0/evidence-r002/independent-review.txt
    impact: The implementer self-test provenance does not cover the exact submitted target, so it cannot support target-pinned traceability; independent reruns were required for every PASS.
    fix_condition: Generate a new immutable Evidence Manifest revision pinned to the exact target commit with current changed files and self-test references.
    owner: agent-claude-code
    deadline: before Phase 0 re-verification
