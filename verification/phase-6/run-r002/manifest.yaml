reproduction:
- git clone git@github.com:zzabisagent-lab/Agent-Colab.git && git checkout <target
  commit>
- export PATH=$HOME/.local/bin:$PATH; export AGENT_COLAB_TEST_DATABASE_URL=postgresql://colab@127.0.0.1:54329/colab_test
  (any empty PostgreSQL 16 maintenance DB; the test session creates and drops its
  own database and runs migrations 0001-0021)
- 'make ci   # lint, tests, doc checks, build; sidecar: uv run pytest sidecar/tests
  -q'
- Every V-P6 Test has a SELF evidence attempt under evidence/phase-6/SELF-V-P6-NN/attempt-NN/result.json
  listing the exact command; the latest attempt of each ID is PASS
- 'Approvals (V-P6-01/02/22/29): uv run pytest tests/integration/test_approval_collaboration_db.py
  -q'
- 'Brainstorm (V-P6-03/04/26/27): uv run pytest tests/unit/test_brainstorm_limits.py
  tests/integration/test_brainstorm_engine_db.py tests/integration/test_brainstorm_decisions_db.py
  -q'
- 'Documents (V-P6-07..14, 19, 20, 23, 24, 28): uv run pytest tests/integration/test_document_finalizer_db.py
  tests/integration/test_document_provenance_db.py tests/integration/test_document_redaction_db.py
  tests/integration/test_document_rate_db.py tests/integration/test_schedule_period_summary_db.py
  tests/unit/test_narrative_citations.py -q'
