known_gaps:
- 'Only Task documents reach FINALIZED: the DOCUMENT_FINALIZED Event requires a verification_id
  and only Tasks have a VerificationRun, so Brainstorm, Schedule Run and period documents
  stay drafts gated by the publish review rather than weakening the Phase 1 Event
  contract.'
- The reference wiki connector (V-P6-21) is BookStack, exercised against its HTTP
  API through an injectable transport so the contract tests run offline; Wiki.js keeps
  the same adapter contract but is not implemented.
- Malware scanning uses a signature scanner in tests and a ClamAV client when a socket
  is configured; a scan that cannot run quarantines the artifact rather than passing
  it (ARTIFACT_SCAN_UNAVAILABLE).
- The Git publisher pushes into a local bare repository in the tests; Gitea or another
  remote is a configuration change, not a code path.
- Narrative paragraphs come from a Documentation Agent with the document.narrate capability;
  when none is available or it declines, the skeleton-only document is a valid draft
  and the reason code is recorded.
- V-P6-13 canary redaction covers canonical and published documents plus captured
  logs; the raw fixture that carries the canary is excluded by design.
