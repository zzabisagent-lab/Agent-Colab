findings:
  - id: F-P6-001
    severity: Medium
    affected: [REQ-DOCS-001, REQ-DOCS-002, V-P6-08, V-P6-20, P6-04, P6-08, P6-09]
    summary: Closing a Brainstorm does not invoke automatic document generation.
    target_commit: ccf900efa67cd46aee085c36dbf6515db406ea47
    environment: Linux x86_64, Python 3.12.3, PostgreSQL 16.15, migrations 0001-0021
    reproduction:
      - Run uv run pytest verification/phase-6/evidence-r001/test_v_p6_08_20_automatic.py -q -p tests.conftest -p no:cacheprovider.
      - Start and close 20 Brainstorms through StartBrainstorm and CloseBrainstorm.
      - Count document_freezes rows for those Brainstorm IDs.
    expected: At least 19 of 20 closed Brainstorms automatically create drafts; one closed session has arguments, alternatives, decisions, and limitations in its draft.
    actual: All 20 sessions closed but the automatic-draft count was 0; CloseBrainstorm returns after changing session state without calling on_brainstorm_closed.
    evidence_ref: verification/phase-6/evidence-r001/v-p6-08-20-automatic.junit.xml
    impact: Closed collaboration sessions have no automatic canonical record, and the per-type document-generation SLO is 0 percent for Brainstorms.
    fix_condition: Wire the committed Brainstorm-close path to idempotent automatic drafting, then independently reproduce content requirements and at least 19/20 drafts.
  - id: F-P6-002
    severity: Low
    affected: [REQ-DOCS-005, V-P6-19, P6-04]
    summary: Task closure without a latest PASSED verification returns the wrong stable error code.
    target_commit: ccf900efa67cd46aee085c36dbf6515db406ea47
    environment: Linux x86_64, Python 3.12.3, PostgreSQL 16.15, migrations 0001-0021
    reproduction:
      - Run uv run pytest verification/phase-6/evidence-r001/test_v_p6_19_exact.py -q -p tests.conftest -p no:cacheprovider.
      - Create a Task draft, record a FAILED verification, and attempt CompleteTask.
    expected: COMPLETION_PREREQUISITE_MISSING and unchanged Task state.
    actual: VERIFICATION_REQUIRED with missing details containing both VERIFICATION_REQUIRED and COMPLETION_PREREQUISITE_MISSING; Task state remains unchanged.
    evidence_ref: verification/phase-6/evidence-r001/v-p6-19-exact.junit.xml
    impact: Clients cannot rely on the Phase 6 closure-gate error contract, although the unsafe transition remains blocked.
    fix_condition: Return COMPLETION_PREREQUISITE_MISSING for each V-P6-19 missing-prerequisite case and tighten the repository test to require that exact code.
