- 'V-P2-15 (Bridge delivery latency) is measured in-process: 100 deliveries at 10
  msg/s against a recording provider with a virtual clock and a drain every second
  (p95 asserted ≤ 5 s, zero loss/duplicates). The live Telegram relay path is exercised
  separately by tests/integration/test_bridge_live.py (real Bot API, forum topics;
  skipped without TELEGRAM_* keys); Mattermost provider calls run against the local
  Team Edition (scripts/dev/mattermost-local.sh).'
- SMTP notification provider is verified with a fake in-process transport (routing,
  gating, DM duplicate guard); no live SMTP host is configured in this environment.
- Executing Task commands from Telegram requires an administrator to set content_policy.telegram_commands
  (allowed_verbs) on the Bridge; the default policy is read/reply only (V-P2-16).
  link.* verbs never execute from Telegram.
- The web console is the minimal administrative surface for this phase (login with
  a human service token, channel list, Bridge create/enable/disable/test); the Playwright
  e2e test uses the user-space Chromium wrapper on hosts without root (PLAYWRIGHT_CHROMIUM_EXECUTABLE).
- Channel deletion is a soft delete (status `deleted` + `channel.delete` audit); the
  baseline defines no deletion Event, so CHANNEL_ARCHIVED stays the last aggregate
  Event (V-P2-18).
- 'Policy denials on the API path are audited in an independent transaction (found
  and fixed during P2-07: a denial raised out of the command transaction previously
  rolled the audit row back).'
