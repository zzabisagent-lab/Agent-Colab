reproduction:
- git clone git@github.com:zzabisagent-lab/Agent-Colab.git && git checkout <target
  commit>
- export PATH=$HOME/.local/bin:$PATH; export AGENT_COLAB_TEST_DATABASE_URL=postgresql://colab@127.0.0.1:54329/colab_test
  (any empty PostgreSQL 16 maintenance DB; the test session creates and drops its
  own database and runs migrations 0001-0007)
- 'make bootstrap && make lint && make test && make check-docs && make build   # make
  build includes the web console (pnpm)'
- Every V-P2 Test has a SELF evidence attempt under evidence/phase-2/SELF-V-P2-NN/attempt-NN/result.json
  listing the exact command; the latest attempt of each ID is PASS
- 'Bridge rules and relay: uv run pytest tests/integration/test_bridge_db.py tests/unit/test_bridge_rules.py
  -q -s   (V-P2-03..08/10/13/14/15/17); live Telegram: uv run pytest tests/integration/test_bridge_live.py
  -q (needs TELEGRAM_BOT_TOKEN, TELEGRAM_TEST_CHAT_A/B)'
- 'Mattermost provider (local TE): scripts/dev/mattermost-local.sh start; uv run pytest
  tests/integration/test_mattermost_provider.py -q -rs   (V-P2-01, V-P2-19)'
- 'Bridge Admin UI (V-P2-12): cd web-admin && pnpm install && pnpm run build; PLAYWRIGHT_CHROMIUM_EXECUTABLE=<chromium>
  uv run pytest tests/e2e/test_admin_bridges_ui.py -q'
- 'Command grammar / cards / actions / i18n: uv run pytest tests/unit/test_command_router.py
  tests/integration/test_task_cards.py tests/integration/test_actions_db.py tests/integration/test_i18n_channels.py
  -q'
- 'External identity, link challenge, channel config/lifecycle: uv run pytest tests/integration/test_external_identity_commands.py
  tests/unit/test_link_challenge.py tests/integration/test_channel_config_db.py -q'
- 'Messages/retention and notifications: uv run pytest tests/integration/test_message_retention.py
  tests/integration/test_notification_delivery.py tests/unit/test_notification_providers.py
  -q'
