findings:
  - id: F-P2-001
    severity: Medium
    affected: [V-P2-08, REQ-BRDG-006]
    summary: Mattermost half of the mandatory provider-outage recovery criterion is not reproduced.
    target_commit: 8680e799277790b11fa9fc858f53e678888cfb46
    environment: sha256:af4ae054a87f9fc1f7ec5f4105974baaf9c0c7d29d2911b32b383fbe3c83b688
    reproduction:
      - Run `uv run pytest tests/integration/test_bridge_db.py -q -s`.
      - Inspect `test_outage_recovery_exactly_once_and_dead_letters`; its failing provider is TelegramBridgeProvider only.
      - Search tests for an equivalent 10-minute Mattermost provider outage; none is present.
    expected: A 10-minute outage of each provider is exercised; core continues and recovery produces exactly-once delivery for both.
    actual: Telegram outage/recovery passes, but Mattermost outage/recovery has insufficient execution evidence.
    evidence_ref: verification/phase-2/evidence-r001/negative-latency-targets.log
    impact: A Mattermost-specific retry or recovery defect could pass the Phase 2 gate undetected.
    fix_condition: Add and independently pass a 10-minute virtual-clock Mattermost outage/recovery case proving core continuity, exactly-once delivery, and consistent mapping/outbox state.
  - id: F-P2-002
    severity: Medium
    affected: [V-P2-27, REQ-MMUX-003]
    summary: Link-challenge lockout begins one failed attempt earlier than the v8 criterion.
    target_commit: 8680e799277790b11fa9fc858f53e678888cfb46
    environment: sha256:af4ae054a87f9fc1f7ec5f4105974baaf9c0c7d29d2911b32b383fbe3c83b688
    reproduction:
      - Run `uv run pytest tests/unit/test_link_challenge.py -q`.
      - Inspect `test_five_failures_lock_for_fifteen_minutes_and_the_sixth_is_blocked`.
      - Observe that attempts 1-4 return invalid, attempt 5 returns EXTERNAL_IDENTITY_LOCKED, and attempt 6 is already blocked.
    expected: Attempts 1-5 are failed confirmations and the 15-minute lockout begins from the sixth failure.
    actual: The fifth failed confirmation returns EXTERNAL_IDENTITY_LOCKED; the sixth request is blocked by an already-active lockout.
    evidence_ref: tests/unit/test_link_challenge.py
    impact: Legitimate users receive fewer challenge attempts than the mandated security/UX contract and the implementation does not match the pinned criterion.
    fix_condition: Make the first five wrong confirmations return the invalid-code result, start lockout on failure six, and pass valid/wrong/expired/reused plus post-lockout tests.
  - id: F-P2-003
    severity: Medium
    affected: [V-P2-28, REQ-MMUX-004]
    summary: Agent identity display is not verified through the mandatory MCP Agent utterance path.
    target_commit: 8680e799277790b11fa9fc858f53e678888cfb46
    environment: sha256:af4ae054a87f9fc1f7ec5f4105974baaf9c0c7d29d2911b32b383fbe3c83b688
    reproduction:
      - Run `rg -n 'agent_display_name|identity_display|identity_injection' tests`.
      - Run `uv run pytest tests/unit/test_identity_display.py tests/integration/test_actions_db.py -q -k identity`.
      - Observe that tests call the delivery provider directly and do not originate an utterance through MCP.
    expected: An MCP Agent utterance traverses the production path and proves exact override or prefix fallback while injected display identity is ignored and audited.
    actual: Direct provider display and injection tests pass, but no MCP-originated utterance is exercised, leaving the required end-to-end method without evidence.
    evidence_ref: verification/phase-2/evidence-r001/phase2-independent-suites.log
    impact: Identity metadata could be lost, altered, or trusted incorrectly between MCP ingress and provider delivery without detection.
    fix_condition: Add and independently pass an MCP-originated Agent utterance test covering override-disabled fallback, exact display, payload injection rejection, and audit persistence.
result: FAILED
residual_risks:
  - Live Telegram evidence used a verifier-only adapter because repository tests ignore exported credentials and read only `.env`; the adapter supplied exported variables without logging values.
  - SMTP notification routing was exercised with the in-process fake transport because no live SMTP host is configured.
  - Renderer and Bridge latency measurements use an injectable virtual clock and recording providers; the real Telegram relay was checked separately.
