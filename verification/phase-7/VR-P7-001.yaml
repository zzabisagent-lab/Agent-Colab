findings:
  - id: F-P7-001
    severity: High
    affected: [REQ-QGAT-007, V-P7-11]
    summary: Pinned release images contain 36 High-severity vulnerabilities.
    reproduction:
      - Run each scan function from tools.security_scan against release/manifest.json.
      - Inspect the container report's counts and blocking fields.
    expected: SAST, dependency, container, and dynamic scans contain zero High or Critical findings.
    actual: The Trivy container scan ran and returned 36 High findings; the other three scans returned zero blocking findings.
    evidence_ref: verification/phase-7/evidence-r001/V-P7-11-four-scans.json
    impact: The mandatory security gate is open and vulnerable container packages would ship.
    fix_condition: Rebuild both target-commit images on remediated base/runtime packages and independently rerun all four scans with zero High or Critical findings.
  - id: F-P7-002
    severity: Medium
    affected: [REQ-RELS-001, V-P7-15]
    summary: Release artifacts are unsigned and are not pinned to the target commit.
    reproduction:
      - Inspect release/manifest.json for source_revision and signature.
      - Compare source_revision with git rev-parse HEAD and search the release workflow for signing or attestation.
    expected: The target release has immutable image digests, matching SBOM hashes, and a verifiable signature tied to commit 7ad91d0bc4fa94f11a5d1cb90bcc0371049a9806.
    actual: Signature is null; no signature artifact or signing workflow exists; source_revision is 7d817278ebe3ec417f518fe870d674838f199076 rather than the target commit.
    evidence_ref: verification/phase-7/evidence-r001/V-P7-15-artifact-inspection.log
    impact: Consumers cannot authenticate the artifacts or establish that they represent the verified target.
    fix_condition: Build artifacts from the target commit, sign/attest them, record the verifiable signature, and independently verify digest, SBOM, signature, and source revision.
  - id: F-P7-003
    severity: Medium
    affected: [REQ-OPS-003, V-P7-04]
    summary: The required 24-hour soak is replaced by a 30-minute default.
    reproduction:
      - Inspect tests/e2e/test_soak.py.
      - Observe that AGENT_COLAB_SOAK_MINUTES defaults to 30 and the module explicitly calls this a bounded substitute for 24 hours.
    expected: Bridge, heartbeat, scheduler, and lease run for 24 hours with zero leaks, duplicates, or stuck work.
    actual: No 24-hour independent run exists; the supplied test's default duration is 30 minutes.
    evidence_ref: verification/phase-7/evidence-r001/method-gap-audit.log
    impact: Long-duration resource growth and stuck-work behavior remain unverified.
    fix_condition: Execute the production-path soak for 24 continuous hours and preserve duration plus leak/duplicate/stuck metrics meeting the criterion.
  - id: F-P7-004
    severity: Medium
    affected: [REQ-MMUX-004, V-P7-02, V-P7-22]
    summary: Human-path acceptance replaces Mattermost with an in-process fake.
    reproduction:
      - Run tests/e2e/test_human_path_acceptance.py and observe 20/20 and 10/10 application-path successes.
      - 'Inspect the fixture and observe prov.set_client_factory(lambda inst: FAKE) with FakeMattermostClient.'
    expected: The mandatory paths traverse Mattermost itself, including real cards, threads, callbacks, and notifications.
    actual: The tests directly call Router and ActionHandler and drain to FakeMattermostClient; no Mattermost server or API participates.
    evidence_ref: verification/phase-7/evidence-r001/V-P7-02-13-22-e2e-tabletop.log + verification/phase-7/evidence-r001/method-gap-audit.log
    impact: Provider transport, Mattermost rendering/callback compatibility, and external thread behavior are not acceptance-tested.
    fix_condition: Reproduce 20 consecutive full E2E successes and 10 consecutive Human-only successes through a forum-enabled Mattermost test tenant with all stated UI/message assertions.
  - id: F-P7-005
    severity: Medium
    affected: [REQ-RELS-002, V-P7-17]
    summary: Residual risks have no recorded acceptor.
    reproduction:
      - Inspect docs/security/residual-risks.md.
      - Compare its columns with the V-P7-17 owner/deadline/acceptor criterion.
    expected: Every open residual risk identifies an owner, deadline, and acceptor.
    actual: Three risks list owner and deadline, but the register has no acceptor column or values.
    evidence_ref: verification/phase-7/evidence-r001/method-gap-audit.log
    impact: Risk acceptance authority and accountability cannot be established.
    fix_condition: Record an eligible acceptor for every open risk and independently validate all three required fields.
  - id: F-P7-006
    severity: Medium
    affected: [REQ-RELS-002, V-P7-18]
    summary: The mandatory deployment-approval record and final development report are absent.
    reproduction:
      - Test for REPORT.md in the target checkout.
      - Search non-baseline repository state for a recorded explicit deployment decision and deployment artifacts.
    expected: The final development report is delivered and an explicit user decision is recorded before any deployment action.
    actual: REPORT.md and an explicit decision are absent; no deployment artifact was found.
    evidence_ref: verification/phase-7/evidence-r001/V-P7-18-approval-state.log
    impact: V-P7-18 cannot pass, and the baseline sequencing makes this criterion depend on an action documented to occur only after Phase 7 passes.
    fix_condition: Resolve the baseline sequencing conflict, deliver the final report, record the user's explicit decision, and prove zero deployment action preceded it.
