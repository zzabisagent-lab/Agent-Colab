known_gaps:
- 'V-P7-18 (deployment approval) cannot be satisfied by the implementer: it records
  the user''s explicit decision after the final report is delivered. The report and
  the single question are produced once this Phase passes; nothing is deployed without
  that answer.'
- 'The soak (V-P7-04) ran 30 minutes at the normal profile rather than 24 hours, and
  is documented as a bounded window that watches the growth trends a leak would show
  at any scale: worker memory grew 1.2 %, connections stayed flat, open work items
  began and ended at zero, with no stuck claimed Runs, dead letters or duplicate deliveries.'
- 'Image signing is not performed: this environment has no registry and no signing
  key. Recorded as a Low residual risk with an owner and a deadline. Digests are content-addressed
  and recorded in release/manifest.json; `--verify` gates on the recorded digest still
  resolving and SBOM hashes matching, and reports reproducibility per image (web-admin
  reproduces, server does not, with the reason recorded).'
- The container scan runs Trivy through Docker; where a scanner cannot run at all
  the scan records SCANNER_UNAVAILABLE rather than reporting clean.
- Peak load (V-P7-03) was measured on this build host with four API processes and
  two workers; the serving process count is a deployment parameter and the release
  notes carry the sizing rule (offered rate, not a short run's p95).
- Human-path acceptance (V-P7-02, V-P7-22) drives channel surfaces only, through the
  provider's client-factory seam with an in-process Mattermost client; the same seam
  a real Team Edition instance plugs into. The clean install (V-P7-01) does contact
  a real Mattermost Team Edition for its preflight.
