reproduction:
- git clone git@github.com:zzabisagent-lab/Agent-Colab.git && git checkout <target
  commit>
- export PATH=$HOME/.local/bin:$PATH; export AGENT_COLAB_TEST_DATABASE_URL=postgresql://colab@127.0.0.1:54329/colab_test
- 'make ci   # lint, tests, doc checks, build; sidecar: uv run pytest sidecar/tests
  -q'
- Every V-P7 Test has a SELF evidence attempt under evidence/phase-7/SELF-V-P7-NN/attempt-NN/result.json;
  the latest attempt of each is PASS
- 'Release build and scans: uv run python -m tools.release_build --version <v>; uv
  run python -m tools.security_scan --require'
- 'Clean production install (V-P7-01): COLAB_SERVER_IMAGE=<image> COLAB_MATTERMOST_URL=<url>
  COLAB_MATTERMOST_BOT_TOKEN=<token> uv run python -m tools.clean_install --run'
- 'Backup, restore, upgrade (V-P7-07..10, 19, 20): uv run pytest tests/integration/test_recovery_db.py
  tests/integration/test_upgrade_rollback.py -q'
- 'Load and soak (V-P7-03/04): uv run python -m tests.load.run --profile peak --minutes
  30; observability (V-P7-14): uv run pytest tests/integration/test_observability_alerts_db.py
  -q'
- 'Runbooks, tabletop and acceptance (V-P7-13/21/02/22): uv run pytest tests/e2e/test_incident_tabletop.py
  tests/e2e/test_human_path_acceptance.py -q; uv run python -m tools.runbook_lint'
- 'Evidence archive and residual risks (V-P7-16/17): uv run python -m tools.evidence_archive
  --check --phases 7'
- 'Report and deployment decision (V-P7-18): uv run python -m tools.deployment_decision
  --check; uv run pytest tests/e2e/test_release_evidence.py -q'
