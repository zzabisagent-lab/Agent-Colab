known_gaps:
- 'V-P7-18 (deployment approval) is half implementer, half user. The implementer side
  is done and evidenced: REPORT.md exists with the sections development plan §27A
  requires, docs/operations/deployment-decision.md records the decision state, and
  tools/deployment_decision.py proves the deployment ledger is empty, so no deployment
  preceded a decision. The user side, the explicit answer, is recorded only after
  the report is delivered; the record stays PENDING_USER_DECISION until then. The
  target is referred to as env:deploy-server: .env records a server name, an IP, an
  id and a password, and none of those values appear in the report, the record, the
  evidence or any log.'
- 'V-P7-04 FAILS and is submitted failing. Two 24-hour attempts were made and neither
  is valid evidence. The first (evidence/phase-7/soak/rss-only-aborted-2026-09-03.jsonl,
  2.6 h) measured memory as summed VmRSS, which overstates a pre-forked pool by its
  whole shared set; the leak bound now reads private memory. The second (evidence/phase-7/soak/void-jit-14h-2026-09-04.jsonl,
  14.8 h) was voided by a host defect: PostgreSQL tried to JIT-compile the sampler
  aggregates once the tables passed jit_above_cost and this installation has no LLVM
  runtime, blanking 49 of 888 samples, 5.5% against a 1% tolerance. Fixed by jit =
  off on the host and by SET jit = off in samples.database_sample so it cannot recur
  elsewhere. Across 14.8 h and 1,008,059 writes every integrity criterion held (zero
  5xx, duplicates, dead letters, stuck Runs, open work items; heartbeats under 20.5
  s; connections flat), but server private memory reached 1.111x against a 1.10x bound.
  That growth is not an object leak: see evidence/phase-7/soak/memory-investigation.md,
  which excludes object retention in the command path, the HTTP path and the full
  traffic mix, plus logging, copy-on-write un-sharing, arena proliferation and reclaimable
  free memory. The cause is not isolated. PRIVATE_GROWTH_LIMIT was not changed.'
- Image signing uses a locally held Ed25519 key generated outside the repository at
  ~/.local/share/agent-colab/release-signing.key; no registry and no organisational
  signing key exist in this environment, so trust in the public key is local. `--verify`
  fails rather than skips on an absent, wrong or tampered signature, and gates the
  recorded digests and SBOM hashes; registry publication remains a deployment step
  and stays a Low residual risk with an owner and a deadline.
- The container scan runs Trivy through Docker; where a scanner cannot run at all
  the scan records SCANNER_UNAVAILABLE rather than reporting clean.
- Peak load (V-P7-03) was measured on this build host with four API processes and
  two workers; the serving process count is a deployment parameter and the release
  notes carry the sizing rule (offered rate, not a short run's p95).
- Human-path acceptance (V-P7-02, V-P7-22) drives channel surfaces only, through the
  provider's client-factory seam with an in-process Mattermost client; the same seam
  a real Team Edition instance plugs into. The clean install (V-P7-01) does contact
  a real Mattermost Team Edition for its preflight.
