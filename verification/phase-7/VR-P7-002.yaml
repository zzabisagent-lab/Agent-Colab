findings:
  - id: F-P7-R002-001
    severity: Medium
    affected: [REQ-OPS-003, REQ-OPS-007, V-P7-04, V-P7-16]
    summary: No valid 24-hour soak exists and the evidence archive consequently rejects Phase 7.
    reproduction:
      - Run uv run pytest tests/e2e/test_soak.py -q.
      - Inspect the last row of evidence/phase-7/soak/void-jit-14h-2026-09-04.jsonl.
      - Run uv run python -m tools.evidence_archive --check --phases 7.
    expected: A final=true sample covering at least 86400 seconds with zero leaks, duplicates, or stuck work, and an archive check with zero problems.
    actual: The required soak file is absent; the shipped attempt stops at 53281.9 seconds with final=false and a PostgreSQL LLVM/JIT sampler error; the archive checker exits 2.
    evidence_ref: verification/phase-7/evidence-r002/independent-command-results.yaml
    impact: Long-duration Bridge, heartbeat, scheduler, lease, and memory stability is unproven, and the release evidence archive cannot pass.
    fix_condition: Complete a clean 24-hour production-path soak meeting every V-P7-04 bound, archive its final samples, and rerun the soak and archive checks successfully.
  - id: F-P7-R002-002
    severity: Medium
    affected: [REQ-RELS-001, V-P7-15]
    summary: Published release artifacts are not pinned to the target commit under verification.
    reproduction:
      - Run uv run python -m tools.release_build --verify release/manifest.json --expect-commit 4f2369f49abf78095a6281a6b0d498b47074ad17 --require-clean.
      - Compare release/manifest.json source_revision with git rev-parse HEAD.
    expected: Signed manifest source_revision equals 4f2369f49abf78095a6281a6b0d498b47074ad17 and all pinned artifacts verify.
    actual: The signature and digests verify, but source_revision is dedd2a1943d32c15aba731577b7b9ee7896b78f8; verification exits 1.
    evidence_ref: verification/phase-7/evidence-r002/independent-command-results.yaml
    impact: The inspected immutable images and SBOMs do not establish release provenance for the mandated target commit.
    fix_condition: Rebuild and sign all release artifacts from the target commit, then pass verification with --expect-commit and --require-clean.
  - id: F-P7-R002-003
    severity: Medium
    affected: [REQ-RELS-002, V-P7-18]
    summary: The mandatory explicit deployment decision has not been recorded.
    reproduction:
      - Run uv run python -m tools.deployment_decision --check.
      - Observe state PENDING_USER_DECISION, an empty ledger, and deployment_performed=false.
    expected: The final development report is delivered and the user's explicit deployment approval is recorded before any deployment action.
    actual: The report exists and no deployment occurred, but no explicit user approval is recorded.
    evidence_ref: verification/phase-7/evidence-r002/independent-command-results.yaml
    impact: The mandatory V-P7-18 criterion is incomplete; deployment remains correctly prohibited.
    fix_condition: After all Phase 7 failures are resolved and the final report is delivered, record the user's explicit decision and prove no deployment preceded it.
