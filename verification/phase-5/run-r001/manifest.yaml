reproduction:
- git clone git@github.com:zzabisagent-lab/Agent-Colab.git && git checkout <target
  commit>
- export PATH=$HOME/.local/bin:$PATH; export AGENT_COLAB_TEST_DATABASE_URL=postgresql://colab@127.0.0.1:54329/colab_test
  (any empty PostgreSQL 16 maintenance DB; the test session creates and drops its
  own database and runs migrations 0001-0018)
- 'make ci   # lint, tests, doc checks, build; sidecar: uv run pytest sidecar/tests
  -q'
- Every V-P5 Test has a SELF evidence attempt under evidence/phase-5/SELF-V-P5-NN/attempt-NN/result.json
  listing the exact command; the latest attempt of each ID is PASS
- 'Schedule core (V-P5-01..08, 22, 24, 26, 29, 31..36): uv run pytest tests/unit/test_schedule_api_models.py
  tests/integration/test_schedules_api_db.py tests/integration/test_schedule_planner_db.py
  tests/integration/test_schedule_runner_db.py -q'
- 'Execution (V-P5-09..21, 23, 27, 28, 30, 37): uv run pytest tests/integration/test_schedule_execution_db.py
  tests/integration/test_schedule_recovery_db.py tests/integration/test_schedule_notices_db.py
  tests/integration/test_schedule_budget_db.py tests/integration/test_schedule_latency.py
  -q'
- 'Metrics (V-P5-25): uv run pytest tests/unit/test_schedule_metrics.py tests/integration/test_schedule_metrics_db.py
  -q'
- 'Schedule Admin UI (V-P5-21/22 UI halves): cd web-admin && pnpm install && pnpm
  run build; PLAYWRIGHT_CHROMIUM_EXECUTABLE=<chromium> uv run pytest tests/e2e/test_admin_schedules_ui.py
  -q'
