known_gaps:
- The cron next-run reference (V-P5-02) cross-checks 50 expressions × next 10 against
  croniter as a development-only reference (ADR-0002/ADR-0006); croniter is never
  imported at runtime. The normative implementation is server/schedules/cron.py.
- 'Start-delay p95 (V-P5-27) is a virtual-clock simulation: 100 active Schedules,
  20 due per minute, 2 runners, 4 ticks per minute; p95 and max stay at or below 60
  s. No wall-clock load generator runs in this environment; Phase 7 (P7-04) covers
  sustained load.'
- Dual-planner and dual-runner concurrency (V-P5-06/07) run as concurrent threads
  against the same PostgreSQL instance, relying on the unique occurrence key and FOR
  UPDATE SKIP LOCKED rather than two operating-system processes.
- Channel notices are asserted on the delivery outbox rows and rendered payloads;
  a live Mattermost instance is exercised separately by the Phase 2 provider tests.
- Secret leases for Runs use the Phase 4 local Broker; per-Run leases are revoked
  at Run end (V-P5-17) and the canary scan from Phase 4 covers leakage paths.
