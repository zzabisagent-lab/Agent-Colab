findings:
  - id: F-P5-001
    severity: High
    affected: [REQ-SCHD-001, V-P5-08]
    summary: Post-Task-creation crash idempotency criterion is not exercised.
    reproduction:
      - Run the focused Phase 5 suite recorded in phase5-verbose.log.
      - Inspect tests/integration/test_schedule_runner_db.py lines 238-270.
      - Observe that the test creates/plans ScheduleRuns and replans them, but never creates a Task, injects a crash after Task creation, retries execution, or checks duplicate Tasks/side effects.
    expected: A crash/retry after Task creation produces zero duplicate Tasks and zero duplicate side effects.
    actual: The green test only proves deterministic Run idempotency keys and duplicate-free replanning; the mandatory crash boundary remains unverified.
    evidence_ref: verification/phase-5/evidence-r001/method-audit.txt
    impact: Duplicate execution is an explicit High/immediate-fail Phase 5 risk, so absence of evidence at the required crash boundary blocks PASS.
    fix_condition: Add and independently pass a failpoint or killed-worker test after committed Task creation, then retry/recover and query exactly one Task and one set of side effects.
  - id: F-P5-002
    severity: Medium
    affected: [REQ-SCHD-014, V-P5-17]
    summary: Secret leakage criterion is tested without any synthetic secret value.
    reproduction:
      - Run the focused Phase 5 suite recorded in phase5-verbose.log.
      - Inspect tests/integration/test_schedule_execution_db.py lines 148-242.
      - Observe that only a secret reference and metadata row are created; no value is stored/accessed/injected and no runtime evidence surfaces are scanned for a canary.
    expected: Per-Run secret use has a short revoked lease and a synthetic secret canary appears in none of Events, Tasks, logs, notices, outbox payloads, or persisted Run data.
    actual: Lease TTL/single-use/revocation are proven, but the zero-leakage criterion is not exercised.
    evidence_ref: verification/phase-5/evidence-r001/method-audit.txt
    impact: The execution-path secret boundary lacks Phase 5 evidence; explicit risk acceptance would be required and is unavailable.
    fix_condition: Exercise a synthetic canary through the Run broker/injection path, revoke it at completion, and record negative scans of every persisted and emitted surface.
  - id: F-P5-003
    severity: Medium
    affected: [REQ-SCHD-012, V-P5-24]
    summary: Restart recovery substitutes a virtual lease transition for the required process kill.
    reproduction:
      - Run the focused Phase 5 suite recorded in phase5-verbose.log.
      - Inspect tests/integration/test_schedule_runner_db.py lines 171-219.
      - Observe that the runner is represented by a completed claim call and a FixedClock jump; no scheduler process is killed.
    expected: Killing a runner process immediately after claim is followed by recovery within lease expiry plus two poll intervals with one recovering runner and zero duplicate Tasks.
    actual: The lease-expiry functions pass in-process, but process-death recovery and timing are not executed.
    evidence_ref: verification/phase-5/evidence-r001/method-audit.txt
    impact: Recovery across an actual worker failure remains unverified and requires risk acceptance unavailable in this run.
    fix_condition: Run two scheduler processes, kill the claimant immediately after claim, measure wall-clock recovery, and query one Task with no duplicate side effects.
  - id: F-P5-004
    severity: Medium
    affected: [REQ-SCHD-006, REQ-OPS-007, V-P5-27]
    summary: Mandatory actual normal-load latency measurement is replaced by a virtual-clock simulation.
    reproduction:
      - Run tests/integration/test_schedule_latency.py as recorded in phase5-verbose.log.
      - Inspect lines 31-110 in method-audit.txt.
      - Observe FixedClock time advances, direct SQL transition to CLAIMED, sequential execution, and no DB CPU measurement.
    expected: Actual start-versus-scheduled_for measurements at Human 50, Agents 20, Channels 100, 100 active Schedules, at most 20 due/minute, two runners, and DB CPU below 70 percent yield p95 at most 60 seconds; alert fires above.
    actual: The alert threshold passes, but the reported p95 is constructed by virtual clock/manual batching and DB CPU and the full normal-load population are not measured.
    evidence_ref: verification/phase-5/evidence-r001/method-audit.txt
    impact: The Phase 5 performance gate has no qualifying measurement and cannot be risk-accepted autonomously.
    fix_condition: Run a wall-clock load test with the complete fixed population and two real runners, record start-delay samples and DB CPU, prove p95 at most 60 seconds, and retain the above-threshold alert test.
