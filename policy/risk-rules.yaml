# Action class → risk level → default Approval (development plan §6.9, §7E; spec §8.4).
# Unclassified actions are treated as HIGH at runtime, but `tools/policy_lint.py` requires that
# every known action (MCP tools §7.4, /colab commands §7A.2, API write actions §7.2) is classified.
# When a Capability's side_effect conflicts with the action class, the higher risk applies.
version: 1
risk_levels: [LOW, MEDIUM, HIGH, CRITICAL]
unclassified_default: HIGH
side_effect_conflict: higher_risk_wins
action_classes:
  read_query:        {risk: LOW,      approval: none,           examples: [task_get, document_get]}
  internal_write:    {risk: LOW,      approval: none,           examples: [task_progress, artifact_register]}
  delegation_routing: {risk: MEDIUM,  approval: channel_policy, examples: [task_delegate, reassign, subtask]}
  external_send:     {risk: HIGH,     approval: human_1,        examples: [external API call, mail, delivery outside the Bridge]}
  destructive:       {risk: HIGH,     approval: human_1,        examples: [delete, overwrite, revoke, hard-delete request]}
  secret_exposure:   {risk: CRITICAL, approval: human_2,        examples: [llm_exposure, secret grant scope expansion]}
  production_change: {risk: HIGH,     approval: human_1,        examples: [settings apply, policy rollback, schedule enable]}
approval_defaults:
  quorum: {LOW: 0, MEDIUM: 1, HIGH: 1, CRITICAL: 2}
  human_only_from: HIGH             # HIGH and above are approved by Humans only
  human_only_when_requires_human_approval: true
  critical_requires_distinct_humans: true
  decision_path: {LOW: mattermost_button, MEDIUM: mattermost_button, HIGH: web_console_mfa_reauth, CRITICAL: web_console_mfa_reauth}
  expiry_hours: 24
  reminder_ratio: 0.5
  escalation_role: role-administrator
  self_approval: forbidden          # SELF_APPROVAL_FORBIDDEN, audited
# Full action list. Keys: `tool:<mcp tool>` (§7.4), `command:<resource>.<verb>` (§7A.2),
