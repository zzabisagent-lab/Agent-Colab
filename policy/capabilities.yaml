# Capability catalog (spec §4.2, §9.1; development plan §7.4). A Capability is an executable tool
# with domain/resource/side_effect classification, the schema of its input/output, limits, and
# the vocabulary permission an Agent's Account must hold to use it. Product names never appear.
version: 1
capabilities:
  # --- §7.4 core tools (available to ordinary Agents)
  cap-task-create:        {tool: task_create,        domain: work,          resource: task,          side_effect: false, permission: task.create,          schema: schemas/adapters/tools/task_create.v1.schema.json,        limits: {rate_per_minute: 30}}
  cap-task-get:           {tool: task_get,           domain: work,          resource: task,          side_effect: false, permission: task.read,            schema: schemas/adapters/tools/task_get.v1.schema.json,           limits: {rate_per_minute: 120}}
  cap-task-delegate:      {tool: task_delegate,      domain: work,          resource: task,          side_effect: true,  permission: task.delegate,        schema: schemas/adapters/tools/task_delegate.v1.schema.json,      limits: {rate_per_minute: 10, max_fan_out: 5, max_depth: 3}}
  cap-task-accept:        {tool: task_accept,        domain: work,          resource: work_item,     side_effect: false, permission: task.accept,          schema: schemas/adapters/tools/task_accept.v1.schema.json,        limits: {rate_per_minute: 60}}
  cap-task-progress:      {tool: task_progress,      domain: work,          resource: task,          side_effect: false, permission: task.progress,        schema: schemas/adapters/tools/task_progress.v1.schema.json,      limits: {rate_per_minute: 60}}
  cap-implementation-submit: {tool: implementation_submit, domain: work,    resource: task,          side_effect: false, permission: task.submit,          schema: schemas/adapters/tools/implementation_submit.v1.schema.json, limits: {rate_per_minute: 10}}
  cap-approval-request:   {tool: approval_request,   domain: approval,      resource: approval,      side_effect: false, permission: approval.request,     schema: schemas/adapters/tools/approval_request.v1.schema.json,   limits: {rate_per_minute: 10}}
  cap-artifact-register:  {tool: artifact_register,  domain: artifact,      resource: artifact,      side_effect: false, permission: artifact.write,       schema: schemas/adapters/tools/artifact_register.v1.schema.json,  limits: {rate_per_minute: 30, max_bytes: 104857600}}
  cap-verification-submit: {tool: verification_submit, domain: verification, resource: verification_run, side_effect: false, permission: verification.submit, schema: schemas/adapters/tools/verification_submit.v1.schema.json, limits: {rate_per_minute: 10}}
  cap-verification-evidence-submit: {tool: verification_evidence_submit, domain: verification, resource: verification_run, side_effect: false, permission: verification.submit, schema: schemas/adapters/tools/verification_evidence_submit.v1.schema.json, limits: {rate_per_minute: 30}}
  cap-document-get:       {tool: document_get,       domain: documentation, resource: document,      side_effect: false, permission: document.read,        schema: schemas/adapters/tools/document_get.v1.schema.json,       limits: {rate_per_minute: 60}}
  cap-work-poll:          {tool: work_poll,          domain: work,          resource: work_item,     side_effect: false, permission: work.poll,            schema: schemas/adapters/tools/work_poll.v1.schema.json,          limits: {concurrent_polls: 1, max_wait_seconds: 30}}
  cap-work-ack:           {tool: work_ack,           domain: work,          resource: work_item,     side_effect: false, permission: work.poll,            schema: schemas/adapters/tools/work_ack.v1.schema.json,           limits: {rate_per_minute: 120}}
  cap-work-result:        {tool: work_result,        domain: work,          resource: work_item,     side_effect: false, permission: work.poll,            schema: schemas/adapters/tools/work_result.v1.schema.json,        limits: {rate_per_minute: 60, max_bytes: 1000000}}
  cap-brainstorm-contribute: {tool: brainstorm_contribute, domain: brainstorm, resource: brainstorm, side_effect: false, permission: brainstorm.contribute, schema: schemas/adapters/tools/brainstorm_contribute.v1.schema.json, limits: {rate_per_minute: 20}}
  cap-usage-report:       {tool: usage_report,       domain: metering,      resource: usage_record,  side_effect: false, permission: usage.report,         schema: schemas/adapters/tools/usage_report.v1.schema.json,       limits: {rate_per_minute: 120}}
  # --- specialist capabilities (granted explicitly)
  cap-brainstorm-summarize: {tool: brainstorm_summarize, domain: brainstorm, resource: brainstorm,   side_effect: false, permission: brainstorm.summarize,  schema: schemas/adapters/tools/brainstorm_summarize.v1.schema.json, limits: {rate_per_minute: 5}}
  cap-document-narrate:   {tool: document_narrate,   domain: documentation, resource: document,      side_effect: false, permission: document.narrate,     schema: schemas/adapters/tools/document_narrate.v1.schema.json,   limits: {rate_per_minute: 5, max_bytes: 200000}}
  cap-secret-lease:       {tool: secret_lease,       domain: secret,        resource: secret_grant,  side_effect: false, permission: secret.lease,         schema: schemas/adapters/tools/secret_lease.v1.schema.json,       limits: {rate_per_minute: 20, ttl_seconds: 300, single_use: true}}
  # --- management capabilities (hidden by default; separate admin capability, §7.4)
  cap-agent-register:     {tool: agent_register,     domain: admin,         resource: agent,         side_effect: true,  permission: agent.manage,         schema: schemas/adapters/tools/agent_register.v1.schema.json,     limits: {rate_per_minute: 5}, hidden: true}
  cap-principal-role-assign: {tool: principal_role_assign, domain: admin,   resource: account,       side_effect: true,  permission: admin.accounts,       schema: schemas/adapters/tools/principal_role_assign.v1.schema.json, limits: {rate_per_minute: 5}, hidden: true}
  cap-channel-configure:  {tool: channel_configure,  domain: admin,         resource: channel,       side_effect: true,  permission: channel.manage,       schema: schemas/adapters/tools/channel_configure.v1.schema.json,  limits: {rate_per_minute: 5}, hidden: true}
  cap-bridge-configure:   {tool: bridge_configure,   domain: admin,         resource: bridge,        side_effect: true,  permission: bridge.manage,        schema: schemas/adapters/tools/bridge_configure.v1.schema.json,   limits: {rate_per_minute: 5}, hidden: true}
  cap-secret-grant-create: {tool: secret_grant_create, domain: admin,       resource: secret_grant,  side_effect: true,  permission: secret.grant,         schema: schemas/adapters/tools/secret_grant_create.v1.schema.json, limits: {rate_per_minute: 5}, hidden: true}
  # --- schedule capabilities (hidden by default, §7.4)
  cap-schedule-create:    {tool: schedule_create,    domain: schedule,      resource: schedule,      side_effect: false, permission: schedule.manage,      schema: schemas/adapters/tools/schedule_create.v1.schema.json,    limits: {rate_per_minute: 5}, hidden: true}
  cap-schedule-preview:   {tool: schedule_preview,   domain: schedule,      resource: schedule,      side_effect: false, permission: schedule.read,        schema: schemas/adapters/tools/schedule_preview.v1.schema.json,   limits: {rate_per_minute: 30}, hidden: true}
  cap-schedule-get:       {tool: schedule_get,       domain: schedule,      resource: schedule,      side_effect: false, permission: schedule.read,        schema: schemas/adapters/tools/schedule_get.v1.schema.json,       limits: {rate_per_minute: 60}, hidden: true}
  cap-schedule-pause:     {tool: schedule_pause,     domain: schedule,      resource: schedule,      side_effect: true,  permission: schedule.manage,      schema: schemas/adapters/tools/schedule_pause.v1.schema.json,     limits: {rate_per_minute: 5}, hidden: true}
  cap-schedule-resume:    {tool: schedule_resume,    domain: schedule,      resource: schedule,      side_effect: true,  permission: schedule.manage,      schema: schemas/adapters/tools/schedule_resume.v1.schema.json,    limits: {rate_per_minute: 5}, hidden: true}
  cap-schedule-disable:   {tool: schedule_disable,   domain: schedule,      resource: schedule,      side_effect: true,  permission: schedule.manage,      schema: schemas/adapters/tools/schedule_disable.v1.schema.json,   limits: {rate_per_minute: 5}, hidden: true}
  cap-schedule-run-now:   {tool: schedule_run_now,   domain: schedule,      resource: schedule_run,  side_effect: true,  permission: schedule.run,         schema: schemas/adapters/tools/schedule_run_now.v1.schema.json,   limits: {rate_per_minute: 5}, hidden: true}
  cap-schedule-run-cancel: {tool: schedule_run_cancel, domain: schedule,    resource: schedule_run,  side_effect: true,  permission: schedule.run,         schema: schemas/adapters/tools/schedule_run_cancel.v1.schema.json, limits: {rate_per_minute: 5}, hidden: true}
